<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4ebff"><title>Puzzle Orbis</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="multi.css"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"></head>
<body class="single"><main>
<header class="hero">

</header>
<section class="panel settings">
 <label>Imagem<input id="file" type="file" accept="image/*"></label>
 <label>Nível<select id="level"></select></label>
 <label>Idioma<select id="language"></select></label>
</section>
<section class="panel">
 <div class="hud" aria-live="off">
  <span class="hud-chip"><span aria-hidden="true">⏱</span> <span id="elapsed-label">Tempo</span> <strong id="elapsed" dir="ltr">00:00</strong></span>
  <span class="hud-chip best"><span aria-hidden="true">🏆</span> <span id="best-label">Melhor tempo</span> <strong id="best" dir="ltr">--:--</strong></span>
 </div>
 <p id="status" role="status" aria-live="polite">Aguardando imagem.</p>
 <p id="board-feedback" class="sr-only" role="status" aria-atomic="true"></p>
 <div class="controls quick-actions"><button class="primary" id="shuffle">Embaralhar</button><button class="hint" id="hint">Dica</button><button id="pause" disabled>Pausar</button></div>
 <div class="board-frame"><canvas id="board" tabindex="0" width="640" height="640" aria-label="Tabuleiro do quebra-cabeça"></canvas></div>
</section>
<section class="panel controls actions">
 <button id="save">Salvar neste aparelho</button><button id="reset">Reiniciar</button><button id="replay">Jogar novamente</button><button class="danger" id="delete-save" type="button">Apagar partida salva</button><button class="danger" id="abandon" disabled>Desistir</button>
</section>
<p class="footer-note"><small>Os dados ficam neste navegador. Não há sincronização entre aparelhos.</small></p>
</main><script type="module" src="./src/app.js"></script></body></html>
