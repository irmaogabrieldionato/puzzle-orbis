<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>Puzzle Orbis</title><link rel="manifest" href="manifest.webmanifest"><style>body{font:16px system-ui;background:#0f172a;color:#fff;margin:0;padding:20px}main{max-width:850px;margin:auto}button,select,input{font:inherit;padding:9px;border-radius:8px;margin:5px}button{cursor:pointer}canvas{width:100%;max-width:640px;touch-action:none;background:#1e293b;border-radius:12px}section{display:flex;flex-wrap:wrap;align-items:center}label{display:inline-flex;flex-direction:column}small{color:#cbd5e1}</style></head><body><main><h1>🧩 Puzzle Orbis</h1><p id="help">Escolha uma imagem e organize as peças.</p><section><label>Imagem<input id="file" type="file" accept="image/*"></label><label>Nível<select id="level"></select></label><label>Idioma<select id="language"></select></label></section><section><button id="shuffle">Embaralhar</button><button id="hint">Dica</button><button id="reset">Reiniciar</button><button id="save">Salvar neste aparelho</button><button id="replay">Jogar novamente</button><button id="pause" disabled>Pausar</button><button id="abandon" disabled>Desistir</button></section><p aria-live="off">⏱ <span id="elapsed-label">Tempo</span>: <strong id="elapsed">00:00</strong> · 🏆 <span id="best-label">Melhor tempo</span>: <strong id="best">--:--</strong></p><p id="status" role="status" aria-live="polite">Aguardando imagem.</p><canvas id="board" width="640" height="640" aria-label="Tabuleiro do quebra-cabeça"></canvas><p><small>Os dados ficam neste navegador. Não há sincronização entre aparelhos.</small></p></main><script type="module" src="./src/app.js"></script></body></html>
