name: Pacotes de teste Puzzle Orbis
on:
  push:
    branches: [main, "agent/dot/orb-native-*"]
    paths:
      - 'native/**'
      - 'src/**'
      - 'icons/**'
      - 'index.html'
      - 'multi.html'
      - 'multi.css'
      - 'account.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/build.mjs'
      - '.github/workflows/native-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbis-native-${{ github.ref }}
  cancel-in-progress: true
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix native
      - run: npm run build:web
      - run: node -e "require('node:fs').cpSync('www','native/www',{recursive:true})"
      - run: node native/package-desktop.mjs
      - if: runner.os == 'Linux'
        run: |
          bash native/package-linux-deb.sh
          sudo dpkg -i puzzle-orbis-linux-x64-beta.deb
          test "$(stat -c '%U:%a' /opt/puzzle-orbis/chrome-sandbox)" = 'root:4755'
          timeout 60s xvfb-run -a /usr/bin/puzzle-orbis --orbis-smoke
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'native/dist/puzzle-orbis-win32-x64/puzzle-orbis.exe' -ArgumentList '--orbis-smoke' -PassThru
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw 'Puzzle Orbis did not finish' }
          if ($app.ExitCode -ne 0) { throw "Puzzle Orbis failed ($($app.ExitCode))" }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'native/dist/puzzle-orbis-win32-x64' -DestinationPath 'puzzle-orbis-win32-x64-beta.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-orbis-${{ runner.os }}-x64-beta
          path: puzzle-orbis-*-beta.*
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: native/package-lock.json
      - run: npm ci --prefix native
      - run: npm run build:web
      - run: cp -r www native/www
      - run: npx cap add android
        working-directory: native
      - name: Apply Puzzle Orbis icon
        shell: bash
        run: |
          for i in native/android/app/src/main/res/mipmap-*/ic_launcher*.png; do
            test -f "$i" && cp icons/maskable-512.png "$i"
          done
      - run: npx cap sync android
        working-directory: native
      - name: Build Android and retry Maven rate limits
        shell: bash
        working-directory: native/android
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug bundleRelease 2>&1 | tee "$RUNNER_TEMP/orbis-gradle.log"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'status code 429|Too Many Requests' "$RUNNER_TEMP/orbis-gradle.log"; then
              exit 1
            fi
            sleep "$((attempt * 35))"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-orbis-android-apk-debug-and-aab-unsigned
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify selected Xcode and iOS SDK
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^26\.'
          xcrun --sdk iphonesimulator --show-sdk-version | grep -E '^26\.'
      - run: npm ci --prefix native
      - run: npm run build:web
      - run: cp -r www native/www
      - run: npx cap add ios --packagemanager SPM
        working-directory: native
      - name: Apply Puzzle Orbis icon
        run: |
          directory='native/ios/App/App/Assets.xcassets/AppIcon.appiconset'
          if test -d "$directory"; then
            sips -z 1024 1024 icons/maskable-512.png --out "$directory/orbis-icon.png"
            echo '{"images":[{"filename":"orbis-icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$directory/Contents.json"
          fi
      - run: npx cap sync ios
        working-directory: native
      - name: Build for iOS simulator (no signing)
        run: xcodebuild -project native/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath native/ios-build build
      - name: Install and launch on an iOS 26 simulator
        run: bash native/smoke-ios.sh native/ios-build/Build/Products/Debug-iphonesimulator/App.app
      - run: ditto -c -k --keepParent native/ios-build/Build/Products/Debug-iphonesimulator/App.app puzzle-orbis-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-orbis-ios-simulator-not-for-devices
          path: puzzle-orbis-ios-simulator.zip
          if-no-files-found: error
