name: QA Puzzle Orbis
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build:web
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.cjs
        env:
          PUZZLE_SCREENSHOT: puzzle-orbis-rectangular.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-orbis-browser-evidence
          path: puzzle-orbis-rectangular.png
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-orbis-web
          path: www/
          if-no-files-found: error

  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:web
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - run: node scripts/browser-smoke.cjs
        env:
          PUZZLE_BROWSER: webkit
