<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'none'; base-uri 'none'"><title>Puzzle Orbis · Conta</title><link rel="stylesheet" href="multi.css"></head>
<body><main>
<a href="./">Voltar ao jogo</a>
<h1>Conta Puzzle Orbis</h1>
<p>Entrar na conta não sincroniza fotos, recordes nem partidas. Você pode jogar sem conta.</p>
<p id="account-status" role="status">Verificando disponibilidade da conta…</p>
<section id="account-signed-in" hidden>
 <p id="account-identity"></p>
 <button id="sign-out">Sair da conta</button>
</section>
<section id="account-forms" hidden>
 <h2>Entrar</h2>
 <form id="sign-in"><label>E-mail <input name="email" type="email" maxlength="254" autocomplete="email" required></label><label>Senha <input name="password" type="password" maxlength="128" autocomplete="current-password" required></label><button type="submit">Entrar</button></form>
 <h2>Criar conta</h2>
 <form id="sign-up"><label>Nome <input name="name" maxlength="100" autocomplete="name" required></label><label>E-mail <input name="email" type="email" maxlength="254" autocomplete="email" required></label><label>Senha <input name="password" minlength="12" maxlength="128" type="password" autocomplete="new-password" required></label><p>Use pelo menos 12 caracteres.</p><button type="submit">Criar conta</button></form>
 <h2>Recuperar senha</h2>
 <form id="request-reset"><label>E-mail <input name="email" type="email" maxlength="254" autocomplete="email" required></label><button type="submit">Pedir link de recuperação</button></form>
</section>
<form id="new-password" hidden>
 <h2>Nova senha</h2>
 <label>Nova senha <input name="password" minlength="12" maxlength="128" type="password" autocomplete="new-password" required></label>
 <button type="submit">Salvar nova senha</button>
</form>
</main><script type="module" src="./src/account.js"></script></body>
</html>
